name: RunFastAI v1.4 Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android.yml"
      - "RunFastAI_v1.4_稳定性与全屏采集源码.zip"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract v1.4 source
        run: |
          mkdir source
          unzip -q "RunFastAI_v1.4_稳定性与全屏采集源码.zip" -d source
          SETTINGS_FILE=$(find source -name settings.gradle.kts | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "找不到 settings.gradle.kts"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RunFastAI-v1.4-debug-apk
          path: source/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
